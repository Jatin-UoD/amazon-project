version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: homepilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: homepilot
      POSTGRES_PASSWORD: homepilot_dev
      POSTGRES_DB: homepilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homepilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: homepilot-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  # Optional: backend can also run in Docker for full stack
  # backend:
  #   build: ./apps/backend
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     mosquitto:
  #       condition: service_started
  #   ports:
  #     - "3000:3000"
  #   env_file:
  #     - ./apps/backend/.env

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
